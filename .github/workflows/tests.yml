name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyyaml
      - name: Configure Git identity for hook tests
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "UDS CI"
          git config --global init.defaultBranch main
      - name: Run tests
        run: python -m pytest -q -rs

  integration:
    name: Real scanner integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITLEAKS_VERSION: "8.30.1"
      OSV_SCANNER_VERSION: "2.7.1"
      TRIVY_VERSION: "0.76.2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UDS, Semgrep and PyYAML
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" semgrep pyyaml
      - name: Install scanners (official releases, checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" /tmp/uds-tools && cd /tmp/uds-tools
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks && install -m 0755 gitleaks "$HOME/.local/bin/"
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}"
          curl -sSfLO "$base/osv-scanner_linux_amd64"
          curl -sSfLO "$base/osv-scanner_SHA256SUMS"
          grep " osv-scanner_linux_amd64\$" osv-scanner_SHA256SUMS | sha256sum -c -
          install -m 0755 osv-scanner_linux_amd64 "$HOME/.local/bin/osv-scanner"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfLO "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy && install -m 0755 trivy "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure Git identity
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "UDS CI"
      - name: Run tests with real scanners
        run: python -m pytest -q -rs
      - name: UDS doctor
        run: uds doctor
      - name: Self-scan (UDS scans its own repository)
        run: uds scan . --no-history --allow-network --format json,html,sarif --report-dir uds-reports --fail-on high
      - name: Upload self-scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uds-self-scan
          path: uds-reports/
          retention-days: 14
          if-no-files-found: ignore
